<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  
  <!-- Circuit board pattern -->
  <circle cx="100" cy="100" r="30" fill="none" stroke="#6b73ff" stroke-width="1" opacity="0.4"/>
  <circle cx="100" cy="100" r="60" fill="none" stroke="#6b73ff" stroke-width="0.5" opacity="0.3"/>
  
  <circle cx="1100" cy="500" r="40" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
  <circle cx="1100" cy="500" r="80" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Tech lines and nodes -->
  <line x1="200" y1="50" x2="400" y2="150" stroke="#6b73ff" stroke-width="1" opacity="0.3"/>
  <line x1="400" y1="150" x2="600" y2="80" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  <line x1="600" y1="80" x2="800" y2="200" stroke="#6b73ff" stroke-width="1" opacity="0.3"/>
  
  <circle cx="200" cy="50" r="3" fill="#6b73ff" opacity="0.5"/>
  <circle cx="400" cy="150" r="3" fill="#6b73ff" opacity="0.5"/>
  <circle cx="600" cy="80" r="3" fill="#00d4ff" opacity="0.5"/>
  <circle cx="800" cy="200" r="3" fill="#6b73ff" opacity="0.5"/>
  
  <!-- Grid pattern -->
  <g stroke="#6b73ff" stroke-width="0.5" opacity="0.15">
    <line x1="50" y1="300" x2="950" y2="300"/>
    <line x1="50" y1="350" x2="950" y2="350"/>
    <line x1="50" y1="400" x2="950" y2="400"/>
    <line x1="50" y1="450" x2="950" y2="450"/>
  </g>
  
  <!-- Hexagons -->
  <path d="M 300 450 L 330 435 L 360 450 L 360 480 L 330 495 L 300 480 Z" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.25"/>
  <path d="M 850 150 L 880 135 L 910 150 L 910 180 L 880 195 L 850 180 Z" fill="none" stroke="#6b73ff" stroke-width="1" opacity="0.25"/>
  
  <!-- Coding brackets -->
  <text x="50" y="200" font-family="monospace" font-size="48" fill="#6b73ff" opacity="0.2">&lt;</text>
  <text x="1050" y="450" font-family="monospace" font-size="48" fill="#00d4ff" opacity="0.2">/&gt;</text>
  
  <!-- Subtle glow circles -->
  <circle cx="600" cy="300" r="200" fill="#6b73ff" opacity="0.12" filter="url(#blur)"/>
  <circle cx="300" cy="150" r="150" fill="#00d4ff" opacity="0.1" filter="url(#blur)"/>
  <circle cx="1000" cy="450" r="180" fill="#6b73ff" opacity="0.08" filter="url(#blur)"/>
</svg>
